name: 'Report a problem with an optional tool'
description: 'Help reproduce a failure in the local data or itinerary helpers.'
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 'What happened, and how can we reproduce it?'
      description: 'Include the command, expected result, actual output, platform, tool version, and snapshot. Remove credentials and real participant profiles before posting.'
    validations:
      required: true
